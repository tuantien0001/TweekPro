# Builds the Windows exe, runs the self-tests and packages the installer + portable zip on every push and tag.
# Artifacts: Actions run → "TweekPro-dist". Tags "v*" also publish a GitHub Release with both files attached.
name: Build installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # release.ps1 pushes the "Release vX" commit and then the tag; the tag run publishes, so skip the duplicate branch run.
    if: ${{ !(startsWith(github.ref, 'refs/heads/') && startsWith(github.event.head_commit.message, 'Release v')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, self-test, package (publish.ps1)
        shell: pwsh
        run: .\publish.ps1

      - name: Show self-test summary
        if: always()
        shell: pwsh
        run: if (Test-Path bin\Release\net48\test-results.txt) { Get-Content bin\Release\net48\test-results.txt }

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: TweekPro-dist
          path: dist/*
          if-no-files-found: error

      - name: Release notes from README changelog (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # release.ps1 writes "### <version> (dd/MM/yyyy)" under "## Lịch sử phiên bản"; that section becomes the Release body.
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $text = Get-Content README.md -Raw -Encoding UTF8
          $m = [regex]::Match($text, "(?ms)^### $([regex]::Escape($version))\b[^\r\n]*\r?\n(?<body>.*?)(?=^#{2,3} |\Z)")
          $body = if ($m.Success) { $m.Groups['body'].Value.Trim() } else { "Tweek Pro $version" }
          $body += "`n`n---`n`nTải **TweekPro-$version-Setup.exe** (cài đặt) hoặc **TweekPro-$version-portable.zip** (giải nén và chạy). Ứng dụng đã cài sẽ tự báo bản mới khi khởi động."
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/release-notes.md", $body, (New-Object Text.UTF8Encoding($false)))
          Get-Content "$env:RUNNER_TEMP/release-notes.md"

      - name: GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Tweek Pro ${{ github.ref_name }}
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
