# Builds the Windows exe, runs the self-tests and packages the installer + portable zip on every push and tag.
# Artifacts: Actions run → "TweekPro-dist". Tags "v*" also publish a GitHub Release with both files attached.
name: Build installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, self-test, package (publish.ps1)
        shell: pwsh
        run: .\publish.ps1

      - name: Show self-test summary
        if: always()
        shell: pwsh
        run: if (Test-Path bin\Release\net48\test-results.txt) { Get-Content bin\Release\net48\test-results.txt }

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: TweekPro-dist
          path: dist/*
          if-no-files-found: error

      - name: GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
